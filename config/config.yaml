# Sources and selections for one warehouse build.
# Files are read from and written to the data directory: CLINVAR_HISTORY_DATA_DIR or --data-dir,
# default ./data.

clinvar:
  # Monthly releases from the archive folder. The main-folder files are
  # overwritten every week, so pinned monthly names keep loads reproducible.
  base_url: ftp://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/archive
  releases: ["2025-10", "2026-10"]
  assembly: GRCh38

panel:
  # Hereditary cancer genes. gnomAD is read for all ten; MaveDB score sets
  # (below) cover seven of them.
  genes: [BRCA1, BRCA2, TP53, PTEN, MSH2, MLH1, MSH6, PMS2, PALB2, CHEK2]
  ensembl_lookup_url: https://rest.ensembl.org/lookup/symbol/homo_sapiens
  flank_bp: 0

gnomad:
  release: "4.1"
  dataset: joint
  url_template: https://storage.googleapis.com/gcp-public-data--gnomad/release/4.1/vcf/joint/gnomad.joint.v4.1.sites.chr{chrom}.vcf.bgz
  ancestry_groups: [afr, ami, amr, asj, eas, fin, mid, nfe, sas, remaining]

mavedb:
  api: https://api.mavedb.org/api/v1
  # match_level: nucleotide joins on transcript c. notation, protein on p. notation.
  score_sets:
    - {urn: "urn:mavedb:00000097-0-2", gene: BRCA1, match_level: nucleotide}
    - {urn: "urn:mavedb:00001279-a-1", gene: BRCA2, match_level: nucleotide}
    - {urn: "urn:mavedb:00001259-a-2", gene: PALB2, match_level: nucleotide}
    - {urn: "urn:mavedb:00000068-0-1", gene: TP53, match_level: protein}
    - {urn: "urn:mavedb:00000054-a-1", gene: PTEN, match_level: protein}
    - {urn: "urn:mavedb:00000013-a-1", gene: PTEN, match_level: protein}
    - {urn: "urn:mavedb:00000050-a-1", gene: MSH2, match_level: protein}
    - {urn: "urn:mavedb:00001205-a-1", gene: CHEK2, match_level: protein}

