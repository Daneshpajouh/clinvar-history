# Local hooks run the tools pinned by the project's own environment
# (pip install -e ".[dev]"), so CI and pre-commit use the same versions.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: sqlfluff
        name: sqlfluff lint
        entry: sqlfluff lint
        language: system
        types: [sql]
