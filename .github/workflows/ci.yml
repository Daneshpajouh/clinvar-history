name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: clinvar_history
          POSTGRES_PASSWORD: clinvar_history
          POSTGRES_DB: clinvar_history
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinvar_history" --health-interval 2s --health-retries 30
    env:
      CLINVAR_HISTORY_PG_DSN: postgresql://clinvar_history:clinvar_history@localhost:5432/clinvar_history
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[postgres,dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: sqlfluff lint src/clinvar_history/migrations src/clinvar_history/sql
      - run: pytest --cov=clinvar_history --cov-report=term

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip wheel --no-deps --wheel-dir dist .
      - name: Install the wheel in a fresh environment outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/clinvar_history-*.whl pytest
      # From the checkout root, src/ is not on sys.path, so the package comes from the wheel.
      - run: '"$RUNNER_TEMP/wheel-env/bin/python" -m tests.wheel_smoke'

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clinvar-history:ci .
      # the default entrypoint, as a user runs the published image
      - run: test "$(docker run --rm clinvar-history:ci version)" = "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
