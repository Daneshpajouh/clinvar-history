name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: vwh
          POSTGRES_PASSWORD: vwh
          POSTGRES_DB: vwh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vwh" --health-interval 2s --health-retries 30
    env:
      VWH_PG_DSN: postgresql://vwh:vwh@localhost:5432/vwh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[postgres,dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: sqlfluff lint migrations sql
      - run: pytest --cov=vwh --cov-report=term
