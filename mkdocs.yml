site_name: clinvar-history
repo_url: https://github.com/Daneshpajouh/clinvar-history
theme:
  name: material
markdown_extensions:
  - tables
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - For non-specialists: explainer.md
  - ER diagram: er_diagram.md
  - Data dictionary: data_dictionary.md
  - Data sources: data_sources.md
  - Code walk-through: code_walkthrough.md
  - Monthly refresh SOP: sop_monthly_refresh.md
  - Validation report: validation.md
  - Results: results.md
  - Performance: performance.md
  - Testing: testing.md
  - Logging: logging.md
  - Operations:
      - Runbook: operations/runbook.md
      - Postmortem template: operations/postmortem_template.md
      - "2026-10-19 build failures": operations/postmortems/2026-10-19-clinvar-refresh-build.md
