[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinvar-history"
version = "1.0.2"
description = "Versioned SQL database of ClinVar releases, gnomAD v4.1 frequencies and MaveDB scores on DuckDB and PostgreSQL"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Amir Daneshpajouh" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Database",
]
dependencies = [
  "duckdb>=1.2",
  "polars>=1.20",
  "pyarrow>=16",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "jsonschema>=4.20",
  # DuckDB needs pytz to return TIMESTAMP WITH TIME ZONE values to Python.
  "pytz",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "sqlfluff>=3",
  "types-PyYAML",
  "types-jsonschema",
  "types-pytz",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
clinvar-history = "clinvar_history.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinvar_history = [
  "py.typed",
  "migrations/*.sql",
  "sql/queries/*.sql",
  "defaults/*.yaml",
  "schemas/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT"]
# PLC0415: the CLI imports subcommand modules lazily so `clinvar-history --help` does not load
# duckdb, polars and psycopg.
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clinvar_history"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["psycopg.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: needs a PostgreSQL server named by CLINVAR_HISTORY_PG_DSN",
]
